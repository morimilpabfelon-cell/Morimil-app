name: Genesis Body Preparation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/prepare-genesis-ultra-body-v0-1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-body-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate wrapper and project
        run: ./gradlew --no-daemon --stacktrace --console=plain help

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:testDebugUnitTest > unit-test.log 2>&1
          status=$?
          tail -n 250 unit-test.log
          exit "$status"

      - name: Run Android lint
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:lintDebug

      - name: Build debug APK and instrumentation tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Confirm release signing fails closed without material
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:validateReleaseSigning > release-signing-missing.log 2>&1
          status=$?
          tail -n 120 release-signing-missing.log
          if [[ "$status" -eq 0 ]]; then
            echo "Release signing validation unexpectedly accepted missing material." >&2
            exit 1
          fi
          grep -q "Missing release signing inputs" release-signing-missing.log

      - name: Install emulator and managed-device system images
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses > sdk-licenses.log 2>&1 || true
          "$sdkmanager_path" --install \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-30;aosp_atd;x86" \
            "system-images;android-35;default;x86_64" > sdk-install.log 2>&1
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/system-images/android-30/aosp_atd/x86"
          test -d "$ANDROID_HOME/system-images/android-35/default/x86_64"
          "$ANDROID_HOME/emulator/emulator" -version > emulator-version.log 2>&1 || true

      - name: Build and verify release with ephemeral CI certificate
        shell: bash
        env:
          MORIMIL_RELEASE_STORE_FILE: ${{ runner.temp }}/morimil-ci-release.jks
          MORIMIL_RELEASE_STORE_PASSWORD: morimil-ci-password-v1
          MORIMIL_RELEASE_KEY_ALIAS: morimil-ci-release
          MORIMIL_RELEASE_KEY_PASSWORD: morimil-ci-password-v1
        run: |
          set -euo pipefail
          trap 'rm -f "$MORIMIL_RELEASE_STORE_FILE"' EXIT

          keytool -genkeypair \
            -keystore "$MORIMIL_RELEASE_STORE_FILE" \
            -storepass "$MORIMIL_RELEASE_STORE_PASSWORD" \
            -keypass "$MORIMIL_RELEASE_KEY_PASSWORD" \
            -alias "$MORIMIL_RELEASE_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 2 \
            -dname "CN=Morimil CI,O=Morimil CI,C=PE" \
            -noprompt

          set +e
          ./gradlew --no-daemon --stacktrace --console=plain \
            :app:assembleRelease > release-build.log 2>&1
          status=$?
          tail -n 180 release-build.log
          set -e
          [[ "$status" -eq 0 ]]

          apk="app/build/outputs/apk/release/app-release.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$apk"
          "$apksigner" verify --verbose --print-certs "$apk" | tee release-signature.log
          fingerprint="$(
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-signature.log \
              | head -n 1 \
              | tr -d ':[:space:]'
          )"
          [[ "$fingerprint" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Enable KVM for managed devices
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run managed Android compatibility tests on API 30 and API 35
        shell: bash
        run: |
          set +e
          ./gradlew --continue --no-daemon --stacktrace --console=plain \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            :app:pixel2Api30DebugAndroidTest \
            :app:pixel2Api35DebugAndroidTest > managed-device.log 2>&1
          status=$?
          tail -n 400 managed-device.log
          exit "$status"

      - name: Generate canonical API 30 managed-device coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/quality

          canonical_metadata_sha="7b5ac701da2cc62cff7ea430672d25c94c187c4c0e00c7f3ad8c0c8f9b1bdb79"
          effective_metadata_sha="5117d79d5feb0edff805f4b65d6440577f476662586ee42c7fd297eab7368b6d"
          canonical_lock_sha="49d418a5e5ab8b0f11d29a1b41cb0f40551f70fec7e89661513a701946f44e4e"
          metadata_backup="$(mktemp)"
          cp gradle/verification-metadata.xml "$metadata_backup"

          restore_verification_metadata() {
            cp "$metadata_backup" gradle/verification-metadata.xml
            rm -f "$metadata_backup"
          }
          trap restore_verification_metadata EXIT

          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "$canonical_metadata_sha"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "$canonical_lock_sha"
          python3 -m unittest tools.quality.test_qa6_jacoco_runtime_verification_overlay_v1
          python3 tools/quality/qa6_jacoco_runtime_verification_overlay_v1.py apply \
            --metadata gradle/verification-metadata.xml \
            | tee build/quality/qa6-jacoco-runtime-overlay.log
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "$effective_metadata_sha"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "$canonical_lock_sha"

          rm -rf \
            app/build/intermediates/managed_device_code_coverage \
            app/build/outputs/managed_device_code_coverage \
            app/build/reports/coverage/androidTest/debug/managedDevice

          ./gradlew --dependency-verification=strict \
            --no-daemon --stacktrace --console=plain --max-workers=1 \
            --init-script tools/quality/android-instrumented-coverage.init.gradle \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            :app:pixel2Api30DebugAndroidTest > canonical-api30-coverage.log 2>&1
          tail -n 300 canonical-api30-coverage.log

          mapfile -t canonical_ec_files < <(
            find app/build/outputs/managed_device_code_coverage \
              -type f -name coverage.ec -print | sort
          )
          [[ "${#canonical_ec_files[@]}" -eq 1 ]]
          canonical_ec="${canonical_ec_files[0]}"
          test -s "$canonical_ec"

          mapfile -t provenance_logs < <(
            find app/build/outputs/androidTest-results/managedDevice/debug/pixel2Api30/testlog \
              -type f -name 'adb.*.pull.coverage.ec.ok.txt' -print | sort
          )
          [[ "${#provenance_logs[@]}" -eq 1 ]]
          provenance_log="${provenance_logs[0]}"
          test -s "$provenance_log"

          ./gradlew --dependency-verification=strict \
            --no-daemon --stacktrace --console=plain \
            --init-script tools/quality/android-instrumented-coverage.init.gradle \
            :app:tasks --all > instrumented-coverage-tasks.log 2>&1

          python3 tools/quality/android_instrumented_coverage_v1.py select-task \
            --tasks-file instrumented-coverage-tasks.log \
            --output build/quality/android-instrumented-coverage-task.txt

          coverage_task="$(tr -d '\r\n' < build/quality/android-instrumented-coverage-task.txt)"
          [[ "$coverage_task" =~ ^[A-Za-z0-9_.:-]+$ ]]
          if [[ "$coverage_task" == :* ]]; then
            qualified_task="$coverage_task"
          else
            qualified_task=":app:$coverage_task"
          fi

          ./gradlew --dependency-verification=strict \
            --no-daemon --stacktrace --console=plain --max-workers=1 \
            --init-script tools/quality/android-instrumented-coverage.init.gradle \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -x :app:pixel2Api35DebugAndroidTest \
            "$qualified_task" > instrumented-coverage-report.log 2>&1
          tail -n 250 instrumented-coverage-report.log

          canonical_xml="app/build/reports/coverage/androidTest/debug/managedDevice/report.xml"
          test -s "$canonical_xml"

          python3 tools/quality/android_instrumented_coverage_v1.py summarize \
            --device-id pixel2Api30 \
            --report "$canonical_xml" \
            --execution-data "$canonical_ec" \
            --provenance-log "$provenance_log" \
            --tracked-source com/morimil/app/security/SecretVault.kt \
            --tracked-source com/morimil/app/data/local/MorimilDatabaseEncryption.kt \
            --tracked-source com/morimil/app/data/genesis/GenesisManifestVerifier.kt \
            --tracked-source com/morimil/app/data/genesis/ultra/GenesisUltraAndroidBodyMemoryKeyStore.kt \
            --tracked-source com/morimil/app/data/genesis/ultra/GenesisUltraSignedSeedPreviewCoordinator.kt \
            --json-output build/quality/android-instrumented-coverage.json \
            --markdown-output build/quality/android-instrumented-coverage.md

          test -s build/quality/android-instrumented-coverage.json
          test -s build/quality/android-instrumented-coverage.md
          python3 -m json.tool build/quality/android-instrumented-coverage.json > /dev/null

          python3 tools/quality/qa7_quality_ratchet_v1.py instrumented \
            --baseline tools/quality/qa7_quality_ratchet_baseline.json \
            --instrumented build/quality/android-instrumented-coverage.json \
            --output build/quality/qa7-instrumented-quality-ratchet.json
          python3 -m json.tool build/quality/qa7-instrumented-quality-ratchet.json > /dev/null

          restore_verification_metadata
          trap - EXIT
          test "$(sha256sum gradle/verification-metadata.xml | cut -d' ' -f1)" = "$canonical_metadata_sha"
          test "$(sha256sum app/gradle.lockfile | cut -d' ' -f1)" = "$canonical_lock_sha"
          git diff --exit-code -- gradle/verification-metadata.xml app/gradle.lockfile

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: morimil-validation-reports
          if-no-files-found: ignore
          path: |
            unit-test.log
            release-signing-missing.log
            release-build.log
            release-signature.log
            managed-device.log
            canonical-api30-coverage.log
            instrumented-coverage-tasks.log
            instrumented-coverage-report.log
            sdk-licenses.log
            sdk-install.log
            emulator-version.log
            build/quality/qa6-jacoco-runtime-overlay.log
            build/quality/android-instrumented-coverage-task.txt
            build/quality/android-instrumented-coverage.json
            build/quality/android-instrumented-coverage.md
            build/quality/qa7-instrumented-quality-ratchet.json
            app/schemas/**
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/managed_device_code_coverage/**
            app/build/outputs/managed_device_android_test_additional_output/**
            app/build/outputs/apk/debug/**
