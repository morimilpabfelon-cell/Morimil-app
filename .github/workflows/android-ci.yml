name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Test deliberative artifact certifier
        run: python -m unittest discover -s tools/model-artifacts -p 'test_*.py'

      - name: Validate frozen trimotor evidence
        id: validate-frozen-trimotor-evidence
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python tools/benchmarks/validate_trimotor_v02_physical_benchmark_evidence_v1.py check
            python tools/benchmarks/test_validate_trimotor_v02_physical_benchmark_evidence_v1.py
            python tools/benchmarks/validate_trimotor_v02_physical_benchmark_evidence_v2.py check
            python tools/benchmarks/test_validate_trimotor_v02_physical_benchmark_evidence_v2.py
          } > current-trimotor-evidence-validation.log 2>&1

      - name: Enforce trimotor evidence validation
        if: steps.validate-frozen-trimotor-evidence.outcome == 'failure'
        run: |
          cat current-trimotor-evidence-validation.log
          exit 1

      - name: Test deliberative comparative benchmark
        run: |
          python -m unittest discover -s tools/benchmarks -p 'test_*.py'
          python tools/benchmarks/morimil_deliberative_benchmark_v0.py check
          python tools/benchmarks/validate_v02_baseline_evidence_v0.py check
          python tools/benchmarks/validate_v02_physical_benchmark_evidence_v1.py check

      - name: Test Android arm64 host tools
        run: |
          python tools/android-arm64/run_gemma3n_e2b_arm64_unplugged_energy_v0.py --self-test
          python tools/android-arm64/run_gemma3n_e2b_arm64_unplugged_energy_v0_1.py --self-test
          python tools/android-arm64/run_gemma3n_e2b_arm64_deliberative_benchmark_v0.py --self-test
          python tools/android-arm64/run_gemma3n_e2b_arm64_trimotor_benchmark_v0.py --self-test
          python tools/android-arm64/run_current_gemma3n_e2b_arm64_trimotor_benchmark_v0.py --self-test
          python tools/android-arm64/test_current_trimotor_physical_evidence_v0.py
          python tools/android-arm64/test_run_gemma3n_e2b_arm64_deliberative_benchmark_v0.py
          python tools/android-arm64/test_physical_benchmark_adb_v0.py

      - name: Test quality tooling
        run: python -m unittest discover -s tools/quality -p 'test_*.py'

      - name: Install pinned Python coverage tool
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-cache-dir \
            coverage==7.15.2

      - name: Generate Python coverage baseline
        run: |
          mkdir -p build/quality
          python -m coverage erase
          python -m coverage run -m unittest discover -s tools/governance -p 'test_*.py'
          python -m coverage run --append -m unittest discover -s tools/model-artifacts -p 'test_*.py'
          python -m coverage run --append -m unittest discover -s tools/benchmarks -p 'test_*.py'
          python -m coverage run --append tools/android-arm64/test_current_trimotor_physical_evidence_v0.py
          python -m coverage run --append -m unittest discover -s tools/quality -p 'test_*.py'
          python -m coverage report
          python -m coverage xml
          python -m coverage json

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate Android unit-test coverage baseline
        run: |
          set -o pipefail
          mkdir -p build/quality
          ./gradlew \
            --init-script tools/quality/android-unit-coverage.init.gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:createDebugUnitTestCoverageReport \
            2>&1 | tee build/quality/android-unit-coverage.log

      - name: Derive authored Android coverage view
        run: |
          python tools/quality/android_authored_coverage_v1.py \
            --report app/build/reports/coverage/test/debug/report.xml \
            --source-root app/src/main \
            --json-output build/quality/android-authored-coverage.json \
            --markdown-output build/quality/android-authored-coverage.md \
            --require-generated-exclusion

      - name: Validate coverage baseline reports
        run: |
          set -euo pipefail
          test -s build/quality/python-coverage.xml
          test -s build/quality/python-coverage.json
          test -s app/build/reports/coverage/test/debug/report.xml
          test -s build/quality/android-authored-coverage.json
          test -s build/quality/android-authored-coverage.md
          python -m json.tool build/quality/android-authored-coverage.json > /dev/null
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          python_report = json.loads(
              Path("build/quality/python-coverage.json").read_text(encoding="utf-8")
          )
          python_totals = python_report["totals"]
          assert python_totals["num_statements"] > 0
          assert python_totals["covered_lines"] > 0
          assert python_totals["num_branches"] > 0

          jacoco_root = ET.parse(
              "app/build/reports/coverage/test/debug/report.xml"
          ).getroot()
          jacoco = {
              item.attrib["type"]: {
                  "covered": int(item.attrib["covered"]),
                  "missed": int(item.attrib["missed"]),
              }
              for item in jacoco_root.findall("counter")
          }
          for counter in ("INSTRUCTION", "BRANCH", "LINE"):
              assert counter in jacoco
              assert jacoco[counter]["covered"] + jacoco[counter]["missed"] > 0

          print(
              "PYTHON_COVERAGE="
              f"{python_totals['percent_covered_display']}% "
              f"LINE={python_totals['percent_statements_covered_display']}% "
              f"BRANCH={python_totals['percent_branches_covered_display']}%"
          )
          for counter in ("INSTRUCTION", "BRANCH", "LINE"):
              covered = jacoco[counter]["covered"]
              total = covered + jacoco[counter]["missed"]
              print(f"ANDROID_{counter}_COVERAGE={covered}/{total}={covered / total:.4%}")
          PY

      - name: Generate Android lint evidence
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:lintDebug \
            > build/quality/android-lint.log 2>&1
          status=$?
          tail -n 250 build/quality/android-lint.log
          test -s app/build/reports/lint-results-debug.xml
          exit "$status"

      - name: Enforce QA-7 JVM quality ratchets
        run: |
          python tools/quality/qa7_quality_ratchet_v1.py jvm \
            --baseline tools/quality/qa7_quality_ratchet_baseline.json \
            --android-authored build/quality/android-authored-coverage.json \
            --python-coverage build/quality/python-coverage.json \
            --kotlin-log build/quality/android-unit-coverage.log \
            --lint-xml app/build/reports/lint-results-debug.xml \
            --output build/quality/qa7-jvm-quality-ratchet.json
          python -m json.tool build/quality/qa7-jvm-quality-ratchet.json > /dev/null

      - name: Generate report-only Android mutation pilot
        run: |
          ./gradlew \
            --init-script tools/quality/android-pitest-pilot.init.gradle \
            --no-daemon \
            --stacktrace \
            --console=plain \
            :app:pitestDebug

      - name: Validate Android mutation pilot
        run: |
          set -euo pipefail
          test -s app/build/reports/pitest/debug/mutations.xml
          python tools/quality/android_mutation_report_v1.py \
            --report app/build/reports/pitest/debug/mutations.xml \
            --expected-class com.morimil.app.data.genesis.GenesisManifestVerifierCore \
            --primary-source GenesisManifestVerifier.kt \
            --allowed-inline-source Comparisons.kt \
            --json-output build/quality/android-mutation-pilot.json \
            --markdown-output build/quality/android-mutation-pilot.md
          test -s build/quality/android-mutation-pilot.json
          test -s build/quality/android-mutation-pilot.md
          python -m json.tool build/quality/android-mutation-pilot.json > /dev/null

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload CI diagnostics and quality baselines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-trimotor-evidence-validation
          path: |
            current-trimotor-evidence-validation.log
            build/quality/python-coverage.xml
            build/quality/python-coverage.json
            build/quality/android-unit-coverage.log
            build/quality/android-lint.log
            build/quality/android-authored-coverage.json
            build/quality/android-authored-coverage.md
            build/quality/qa7-jvm-quality-ratchet.json
            build/quality/android-mutation-pilot.json
            build/quality/android-mutation-pilot.md
            app/build/reports/lint-results-debug.xml
            app/build/reports/coverage/test/debug/
            app/build/reports/pitest/debug/
          if-no-files-found: error
          retention-days: 7
